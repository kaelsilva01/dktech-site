services:
  meu-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: dktech-site:v1
    container_name: app-compose
    ports:
      - "8081:80"
    networks:
      - minharede
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: dktech-api:v1
    container_name: dktech-api
    ports:
      - "5000:5000"
    networks:
      - minharede
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  minharede:
    external: true
