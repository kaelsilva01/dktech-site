services:
  meu-site:
    build:
      context: .
      dockerfile: Dockerfile
    image: dktech-site:v1
    container_name: app-compose
    ports:
      - "8081:80"
    networks:
      - minharede
    restart: unless-stopped

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    image: dktech-api:v1
    container_name: dktech-api
    ports:
      - "5000:5000"
    networks:
      - minharede
    restart: unless-stopped

networks:
  minharede:
    external: true
