

name: CI/CD - DK TECH

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'nginx.conf'
      - 'website/**'
      - 'api/**'
      - '.github/workflows/**'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir e publicar imagem do site
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            silvass/dktech-site:latest
            silvass/dktech-site:${{ github.sha }}

      - name: Construir e publicar imagem da API
        uses: docker/build-push-action@v6
        with:
          context: ./api
          file: ./api/Dockerfile
          push: true
          tags: |
            silvass/dktech-api:latest
            silvass/dktech-api:${{ github.sha }}
